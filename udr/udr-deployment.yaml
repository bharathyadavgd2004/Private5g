apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-udr
  namespace: open5gs

spec:
  replicas: 1

  selector:
    matchLabels:
      app: open5gs-udr

  template:
    metadata:
      labels:
        app: open5gs-udr

    spec:
      initContainers:
        - name: wait-mongodb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mongodb 27017; do
                echo "Waiting for MongoDB..."
                sleep 2
              done

        - name: wait-scp
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z open5gs-scp 7777; do
                echo "Waiting for SCP..."
                sleep 2
              done

      containers:
        - name: udr
          image: open5gs:v2.8.0
          imagePullPolicy: Never

          env:
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: DB_URI
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp /etc/open5gs/udr.yaml /tmp/udr.yaml
              sed -i "s/address: POD_IP/address: ${POD_IP}/g" /tmp/udr.yaml
              sed -i "1i db_uri: ${DB_URI}" /tmp/udr.yaml 
              exec /opt/open5gs/bin/open5gs-udrd -c /tmp/udr.yaml
          ports:
            - containerPort: 7777

          volumeMounts:
            - name: config
              mountPath: /etc/open5gs

      volumes:
        - name: config
          configMap:
            name: udr-config
