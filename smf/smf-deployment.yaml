apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-smf
  namespace: open5gs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open5gs-smf
  template:
    metadata:
      labels:
        app: open5gs-smf
    spec:
      initContainers:
        - name: wait-nrf
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z open5gs-nrf 7777; do
                echo "Waiting for NRF..."
                sleep 2
              done
      containers:
        - name: smf
          image: open5gs:v2.8.0
          imagePullPolicy: Never
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp /etc/open5gs/smf.yaml /tmp/smf.yaml
              sed -i "s/address: POD_IP/address: ${POD_IP}/g" /tmp/smf.yaml
              exec /opt/open5gs/bin/open5gs-smfd -c /tmp/smf.yaml
          ports:
            - containerPort: 7777
              protocol: TCP
            - containerPort: 8805
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/open5gs
      volumes:
        - name: config
          configMap:
            name: smf-config
