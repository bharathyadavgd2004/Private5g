apiVersion: v1
kind: ConfigMap
metadata:
  name: open5gs-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  open5gs-monitoring.json: |
    {
      "annotations": [
        {
          "kind": "AnnotationQuery",
          "spec": {
            "builtIn": true,
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "query": {
              "datasource": {
                "name": "-- Grafana --"
              },
              "group": "grafana",
              "kind": "DataQuery",
              "spec": {},
              "version": "v0"
            }
          }
        }
      ],
      "cursorSync": "Off",
      "editable": true,
      "elements": {
        "panel-1": {
          "kind": "Panel",
          "spec": {
            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "hidden": false,
                      "query": {
                        "datasource": {
                          "name": "prometheus"
                        },
                        "group": "prometheus",
                        "kind": "DataQuery",
                        "spec": {
                          "editorMode": "code",
                          "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"open5gs\"}[5m])) by (pod)",
                          "legendFormat": "__auto",
                          "range": true
                        },
                        "version": "v0"
                      },
                      "refId": "A"
                    }
                  }
                ],
                "queryOptions": {},
                "transformations": []
              }
            },
            "description": "",
            "id": 1,
            "links": [],
            "title": "cpu usasge by pod",
            "vizConfig": {
              "group": "piechart",
              "kind": "VizConfig",
              "spec": {
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "fixedColor": "#73BF69",
                      "mode": "palette-classic"
                    },
                    "custom": {
                      "hideFrom": {
                        "legend": false,
                        "tooltip": false,
                        "viz": false
                      }
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "legend": {
                    "displayMode": "list",
                    "overflow": "ellipsis",
                    "placement": "bottom",
                    "showLegend": true
                  },
                  "pieType": "pie",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ],
                    "fields": "",
                    "values": false
                  },
                  "sort": "desc",
                  "tooltip": {
                    "hideZeros": false,
                    "mode": "single",
                    "sort": "none"
                  }
                }
              },
              "version": "13.1.2"
            }
          }
        },
        "panel-2": {
          "kind": "Panel",
          "spec": {
            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "hidden": false,
                      "query": {
                        "datasource": {
                          "name": "prometheus"
                        },
                        "group": "prometheus",
                        "kind": "DataQuery",
                        "spec": {
                          "editorMode": "code",
                          "expr": "sum(container_memory_working_set_bytes{namespace=\"open5gs\"}) by (pod)",
                          "legendFormat": "__auto",
                          "range": true
                        },
                        "version": "v0"
                      },
                      "refId": "A"
                    }
                  }
                ],
                "queryOptions": {},
                "transformations": []
              }
            },
            "description": "",
            "id": 2,
            "links": [],
            "title": "memory usage by pod",
            "vizConfig": {
              "group": "histogram",
              "kind": "VizConfig",
              "spec": {
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "mode": "palette-classic"
                    },
                    "custom": {
                      "fillOpacity": 80,
                      "gradientMode": "none",
                      "hideFrom": {
                        "legend": false,
                        "tooltip": false,
                        "viz": false
                      },
                      "lineWidth": 1,
                      "stacking": {
                        "group": "A",
                        "mode": "none"
                      }
                    },
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": 0
                        },
                        {
                          "color": "red",
                          "value": 80
                        }
                      ]
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "legend": {
                    "calcs": [],
                    "displayMode": "list",
                    "overflow": "ellipsis",
                    "placement": "bottom",
                    "showLegend": true
                  },
                  "tooltip": {
                    "hideZeros": false,
                    "mode": "single",
                    "sort": "none"
                  }
                }
              },
              "version": "13.1.2"
            }
          }
        },
        "panel-3": {
          "kind": "Panel",
          "spec": {
            "data": {
              "kind": "QueryGroup",
              "spec": {
                "queries": [
                  {
                    "kind": "PanelQuery",
                    "spec": {
                      "hidden": false,
                      "query": {
                        "datasource": {
                          "name": "prometheus"
                        },
                        "group": "prometheus",
                        "kind": "DataQuery",
                        "spec": {
                          "editorMode": "code",
                          "expr": "kube_pod_status_phase{namespace=\"open5gs\"} == 1",
                          "legendFormat": "__auto",
                          "range": true
                        },
                        "version": "v0"
                      },
                      "refId": "A"
                    }
                  }
                ],
                "queryOptions": {},
                "transformations": []
              }
            },
            "description": "",
            "id": 3,
            "links": [],
            "title": "pod status",
            "vizConfig": {
              "group": "piechart",
              "kind": "VizConfig",
              "spec": {
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "fixedColor": "#73BF69",
                      "mode": "palette-classic"
                    },
                    "custom": {
                      "hideFrom": {
                        "legend": false,
                        "tooltip": false,
                        "viz": false
                      }
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "legend": {
                    "displayMode": "list",
                    "overflow": "ellipsis",
                    "placement": "bottom",
                    "showLegend": true
                  },
                  "pieType": "pie",
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ],
                    "fields": "",
                    "values": false
                  },
                  "sort": "desc",
                  "tooltip": {
                    "hideZeros": false,
                    "mode": "single",
                    "sort": "none"
                  }
                }
              },
              "version": "13.1.2"
            }
          }
        }
      },
      "layout": {
        "kind": "GridLayout",
        "spec": {
          "items": [
            {
              "kind": "GridLayoutItem",
              "spec": {
                "element": {
                  "kind": "ElementReference",
                  "name": "panel-1"
                },
                "height": 8,
                "width": 12,
                "x": 0,
                "y": 0
              }
            },
            {
              "kind": "GridLayoutItem",
              "spec": {
                "element": {
                  "kind": "ElementReference",
                  "name": "panel-2"
                },
                "height": 8,
                "width": 12,
                "x": 12,
                "y": 0
              }
            },
            {
              "kind": "GridLayoutItem",
              "spec": {
                "element": {
                  "kind": "ElementReference",
                  "name": "panel-3"
                },
                "height": 8,
                "width": 12,
                "x": 0,
                "y": 8
              }
            }
          ]
        }
      },
      "links": [],
      "liveNow": false,
      "preferences": {
        "layout": {
          "kind": "GridLayout",
          "spec": {
            "items": []
          }
        }
      },
      "preload": false,
      "tags": [],
      "timeSettings": {
        "autoRefresh": "",
        "autoRefreshIntervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h",
          "2h",
          "1d"
        ],
        "fiscalYearStartMonth": 0,
        "from": "now-6h",
        "hideTimepicker": false,
        "timezone": "browser",
        "to": "now"
      },
      "title": "open5gs monitoring",
      "variables": []
    }
