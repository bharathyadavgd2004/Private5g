apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-pcf
  namespace: open5gs

spec:
  replicas: 1

  selector:
    matchLabels:
      app: open5gs-pcf

  template:
    metadata:
      labels:
        app: open5gs-pcf

    spec:
      initContainers:
        - name: wait-mongodb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mongodb 27017; do
                echo "Waiting for MongoDB..."
                sleep 2
              done

        - name: wait-scp
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z open5gs-scp 7777; do
                echo "Waiting for SCP..."
                sleep 2
              done

      containers:
        - name: pcf
          image: open5gs:v2.8.0
          imagePullPolicy: Never

          env:
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp /etc/open5gs/pcf.yaml /tmp/pcf.yaml
              sed -i "s/address: POD_IP/address: ${POD_IP}/g" /tmp/pcf.yaml
              exec /opt/open5gs/bin/open5gs-pcfd -c /tmp/pcf.yaml
          ports:
            - containerPort: 7777

          volumeMounts:
            - name: config
              mountPath: /etc/open5gs

      volumes:
        - name: config
          configMap:
            name: pcf-config
