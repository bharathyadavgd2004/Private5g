<svg width="900" height="640" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A2647">Private 5G Network — Architecture</text>

  <!-- Git/CI/CD row -->
  <rect x="30" y="55" width="130" height="50" rx="8" fill="#F2F7FA" stroke="#0A2647"/>
  <text x="95" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#0A2647">GitHub</text>
  <text x="95" y="92" text-anchor="middle" font-size="10" fill="#5B7C99">Manifests + CI</text>

  <rect x="200" y="55" width="130" height="50" rx="8" fill="#F2F7FA" stroke="#0A2647"/>
  <text x="265" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#0A2647">GitHub Actions</text>
  <text x="265" y="92" text-anchor="middle" font-size="10" fill="#5B7C99">Build &amp; push images</text>

  <rect x="370" y="55" width="130" height="50" rx="8" fill="#F2F7FA" stroke="#0A2647"/>
  <text x="435" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#0A2647">ArgoCD</text>
  <text x="435" y="92" text-anchor="middle" font-size="10" fill="#5B7C99">GitOps sync</text>

  <line x1="160" y1="80" x2="200" y2="80" stroke="#0A2647" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="80" x2="370" y2="80" stroke="#0A2647" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Kubernetes cluster boundary -->
  <rect x="30" y="130" width="840" height="420" rx="12" fill="none" stroke="#144272" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="45" y="150" font-size="12" font-weight="bold" fill="#144272">Kubernetes Cluster (Minikube) — namespace: open5gs</text>
  <line x1="435" y1="105" x2="435" y2="130" stroke="#0A2647" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Control plane NFs -->
  <text x="55" y="180" font-size="11" font-weight="bold" fill="#5B7C99">CONTROL PLANE (SBI / HTTP2)</text>
  <g font-size="11" font-weight="bold" fill="#FFFFFF">
    <rect x="55" y="190" width="90" height="34" rx="6" fill="#144272"/><text x="100" y="211" text-anchor="middle">NRF</text>
    <rect x="155" y="190" width="90" height="34" rx="6" fill="#144272"/><text x="200" y="211" text-anchor="middle">SCP</text>
    <rect x="255" y="190" width="90" height="34" rx="6" fill="#144272"/><text x="300" y="211" text-anchor="middle">AUSF</text>
    <rect x="355" y="190" width="90" height="34" rx="6" fill="#144272"/><text x="400" y="211" text-anchor="middle">UDM</text>
    <rect x="455" y="190" width="90" height="34" rx="6" fill="#144272"/><text x="500" y="211" text-anchor="middle">UDR</text>
    <rect x="555" y="190" width="90" height="34" rx="6" fill="#144272"/><text x="600" y="211" text-anchor="middle">PCF</text>
    <rect x="655" y="190" width="90" height="34" rx="6" fill="#144272"/><text x="700" y="211" text-anchor="middle">NSSF</text>
    <rect x="755" y="190" width="90" height="34" rx="6" fill="#144272"/><text x="800" y="211" text-anchor="middle">BSF</text>
  </g>

  <text x="55" y="250" font-size="11" font-weight="bold" fill="#5B7C99">MOBILITY / SESSION</text>
  <g font-size="12" font-weight="bold" fill="#FFFFFF">
    <rect x="55" y="260" width="140" height="38" rx="6" fill="#0A2647"/><text x="125" y="284" text-anchor="middle">AMF</text>
    <rect x="215" y="260" width="140" height="38" rx="6" fill="#0A2647"/><text x="285" y="284" text-anchor="middle">SMF</text>
  </g>

  <!-- User plane -->
  <text x="55" y="330" font-size="11" font-weight="bold" fill="#5B7C99">USER PLANE (GTP-U)</text>
  <rect x="55" y="340" width="140" height="38" rx="6" fill="#00B4D8"/>
  <text x="125" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#0A2647">UPF</text>

  <!-- Data stores / support -->
  <rect x="215" y="340" width="140" height="38" rx="6" fill="#5B7C99"/>
  <text x="285" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">MongoDB</text>
  <rect x="375" y="340" width="140" height="38" rx="6" fill="#5B7C99"/>
  <text x="445" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">WebUI</text>

  <!-- Connectors control->AMF/SMF -->
  <line x1="200" y1="224" x2="200" y2="260" stroke="#144272" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="125" y1="298" x2="125" y2="340" stroke="#144272" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- RAN -->
  <text x="55" y="420" font-size="11" font-weight="bold" fill="#5B7C99">RAN SIMULATION (UERANSIM)</text>
  <rect x="55" y="430" width="140" height="38" rx="6" fill="#7F77DD"/>
  <text x="125" y="454" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">gNB</text>
  <rect x="215" y="430" width="140" height="38" rx="6" fill="#7F77DD"/>
  <text x="285" y="454" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">UE</text>
  <line x1="125" y1="430" x2="125" y2="298" stroke="#144272" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="135" y="365" font-size="9" fill="#5B7C99">N2 (NGAP)</text>
  <line x1="195" y1="449" x2="215" y2="449" stroke="#144272" stroke-width="1"/>
  <line x1="125" y1="378" x2="125" y2="430" stroke="#00B4D8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="135" y="405" font-size="9" fill="#5B7C99">N3 (GTP-U)</text>

  <rect x="700" y="430" width="140" height="38" rx="6" fill="#639922"/>
  <text x="770" y="454" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Internet (N6)</text>
  <line x1="195" y1="358" x2="700" y2="449" stroke="#00B4D8" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrow)"/>

  <!-- Observability -->
  <text x="55" y="500" font-size="11" font-weight="bold" fill="#5B7C99">OBSERVABILITY (namespace: monitoring)</text>
  <rect x="55" y="510" width="150" height="38" rx="6" fill="#E24B4A"/>
  <text x="130" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Prometheus</text>
  <rect x="225" y="510" width="150" height="38" rx="6" fill="#EF9F27"/>
  <text x="300" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A2E02">Grafana</text>
  <rect x="395" y="510" width="150" height="38" rx="6" fill="#1D9E75"/>
  <text x="470" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Loki + Promtail</text>

  <line x1="130" y1="510" x2="130" y2="380" stroke="#E24B4A" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="140" y="480" font-size="9" fill="#5B7C99">scrapes NF metrics</text>
  <line x1="470" y1="510" x2="470" y2="380" stroke="#1D9E75" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="480" y="480" font-size="9" fill="#5B7C99">ships pod logs</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#144272"/>
    </marker>
  </defs>

  <text x="450" y="600" text-anchor="middle" font-size="10" fill="#5B7C99">GitHub → GitHub Actions builds images → ArgoCD deploys manifests → 5G Core + RAN → Prometheus/Grafana/Loki observe it all</text>
</svg>
