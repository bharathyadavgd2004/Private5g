name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.open5gs'
      - 'Dockerfile.ueransim'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-open5gs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push open5gs image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.open5gs
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/open5gs:v2.8.0

  build-ueransim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ueransim image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ueransim
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ueransim:v3.2.7
