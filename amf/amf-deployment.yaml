apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-amf
  namespace: open5gs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open5gs-amf
  template:
    metadata:
      labels:
        app: open5gs-amf
    spec:
      initContainers:
      - name: wait-nrf
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z open5gs-nrf 7777; do
            echo "Waiting for NRF..."
            sleep 2
          done
      - name: wait-scp
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z open5gs-scp 7777; do
            echo "Waiting for SCP..."
            sleep 2
          done
      containers:
      - name: amf
        image: open5gs:v2.8.0
        imagePullPolicy: Never
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        command: ["/bin/sh", "-c"]
        args:
        - |
          cp /etc/open5gs/amf.yaml /tmp/amf.yaml
          sed -i "s/address: POD_IP/address: ${POD_IP}/g" /tmp/amf.yaml
          exec /opt/open5gs/bin/open5gs-amfd -c /tmp/amf.yaml
        ports:
        - name: sbi
          containerPort: 7777
        - name: ngap
          containerPort: 38412
          protocol: SCTP
        volumeMounts:
        - name: config
          mountPath: /etc/open5gs
      volumes:
      - name: config
        configMap:
          name: amf-config
