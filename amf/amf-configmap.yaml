apiVersion: v1
kind: ConfigMap
metadata:
  name: amf-config
  namespace: open5gs

data:
  amf.yaml: |
    logger:
      level: info

    amf:
      amf_name: open5gs-amf

      time:
        t3512:
          value: 540

        t3502:
          value: 720
      sbi:
        server:
          - address: POD_IP
            port: 7777
        client:
          scp:
            - uri: http://open5gs-scp:7777

      ngap:
        server:
          - address: POD_IP

      guami:
        - plmn_id:
            mcc: "999"
            mnc: "70"
          amf_id:
            region: 2
            set: 1

      tai:
        - plmn_id:
            mcc: "999"
            mnc: "70"
          tac: 1

      plmn_support:
        - plmn_id:
            mcc: "999"
            mnc: "70"
          s_nssai:
            - sst: 1

      security:
        integrity_order:
          - NIA2
          - NIA1
          - NIA0
        ciphering_order:
          - NEA0
          - NEA1
          - NEA2

      network_name:
        full: Open5GS-Private5G
